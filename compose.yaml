services:
  postgres:
    image: postgres:18-alpine
    container_name: overload-postgres-dev
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    networks:
      - overload-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: overload-app-dev
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "9229:9229"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - overload-network
    command: >
      sh -c "
        echo '[*] Checking database connection...' &&
        echo '[DB] postgresql://${POSTGRES_USER}:***@postgres:5432/${POSTGRES_DB}' &&
        pnpm prisma generate &&
        pnpm prisma migrate deploy &&
        echo '[OK] Database ready!' &&
        pnpm nest start --watch
      "

  docs:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: overload-docs-dev
    restart: unless-stopped
    ports:
      - "4321:4321"
    volumes:
      - ./apps/docs:/app/apps/docs
      - /app/apps/docs/node_modules
      - /app/node_modules
    networks:
      - overload-network
    command: pnpm --filter apps-docs dev

volumes:
  postgres_dev_data:

networks:
  overload-network: